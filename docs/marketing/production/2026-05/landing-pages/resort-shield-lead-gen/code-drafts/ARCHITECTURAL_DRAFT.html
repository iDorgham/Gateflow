<!-- Resort Shield Lead-Gen Landing Page Draft (May 2026) - ADS TOKENS & DENSITY COMPLIANT -->
<style>
  :root {
    --ds-bg-default: #001A2F; /* Deep Space Navy */
    --ds-bg-brand: #00F2FF; /* GateFlow Cyan */
    --ds-text-heading: #FFFFFF;
    --ds-text-subtle: #CCD6E0;
    --ds-space-100: 8px;
    --ds-space-200: 16px;
    --ds-space-400: 32px;
    --ds-space-800: 64px;
    --ds-border: rgba(255, 255, 255, 0.1);
  }

  body {
    background-color: var(--ds-bg-default);
    color: var(--ds-text-heading);
    font-family: 'Inter', sans-serif;
    margin: 0;
    line-height: 1.5;
  }

  h1, h2, h3 { font-family: 'Outfit', sans-serif; }

  .container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 var(--ds-space-400);
  }

  /* ADS Semantic Section Branding */
  #hero {
    padding: var(--ds-space-800) 0;
    border-bottom: 1px solid var(--ds-border);
  }

  .hero-flex {
    display: flex;
    align-items: center;
    gap: var(--ds-space-400);
  }

  .hero-content { flex: 1; }

  .hero-title {
    font-size: 64px;
    font-weight: 700;
    margin-bottom: var(--ds-space-200);
    background: linear-gradient(90deg, #FFFFFF, var(--ds-bg-brand));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .hero-sub {
    font-size: 20px;
    color: var(--ds-text-subtle);
    margin-bottom: var(--ds-space-400);
  }

  .cta-primary {
    background: var(--ds-bg-brand);
    color: var(--ds-bg-default);
    padding: var(--ds-space-200) var(--ds-space-400);
    font-weight: 600;
    text-decoration: none;
    border-radius: 8px;
    display: inline-block;
  }

  /* ADS High-Density Stats Grid */
  #metrics {
    padding: var(--ds-space-400) 0;
    background: rgba(255, 255, 255, 0.02);
  }

  .metrics-grid {
    display: grid;
    grid-template-cols: repeat(auto-fit, minmax(200px, 1fr));
    gap: var(--ds-space-200);
  }

  .metric-card {
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid var(--ds-border);
    padding: var(--ds-space-200);
    border-radius: 4px;
  }

  .metric-label {
    font-size: 12px;
    color: var(--ds-text-subtle);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .metric-value {
    font-size: 28px;
    font-weight: 700;
    color: var(--ds-bg-brand);
    margin-top: var(--ds-space-100);
  }
</style>

<section id="hero">
  <div class="container hero-flex">
    <div class="hero-content">
      <h1 class="hero-title">The New Standard of Resort Security</h1>
      <p class="hero-sub">GateFlow provides 100ms verification and 2,000+ room scalability for Egypt's leading 5-star resorts.</p>
      <a href="/demo" class="cta-primary">Book My Enterprise Security Audit</a>
    </div>
    <div class="hero-media">
      <img src="../photo/raw/hero.png" style="width: 100%; border-radius: 8px; border: 1px solid var(--ds-border);" />
    </div>
  </div>
</section>

<section id="metrics">
  <div class="container metrics-grid">
    <div class="metric-card">
      <div class="metric-label">Verification Speed</div>
      <div class="metric-value">100ms</div>
    </div>
    <div class="metric-card">
      <div class="metric-label">Max Capacity</div>
      <div class="metric-value">10,000+ Daily</div>
    </div>
    <div class="metric-card">
      <div class="metric-label">Security Protocol</div>
      <div class="metric-value">HMAC-256</div>
    </div>
    <div class="metric-card">
      <div class="metric-label">PMS Sync</div>
      <div class="metric-value">Real-Time</div>
    </div>
  </div>
</section>
