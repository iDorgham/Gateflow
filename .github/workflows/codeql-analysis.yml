# =============================================================================
# codeql-analysis.yml — GateFlow Code Scanning (CodeQL)
#
# Detects common vulnerabilities (XSS, SQLi, Hardcoded Secrets, etc.)
# across all apps and packages in the monorepo.
#
# Runs:
#   - Every push to master/main
#   - Every pull request to master/main
#   - Weekly schedule (Sundays)
# =============================================================================
name: 'CodeQL Analysis'

on:
  push:
    branches: ['main', 'master']
  pull_request:
    branches: ['main', 'master']
  schedule:
    - cron: '30 4 * * 0'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  analyze:
    name: Analyze
    runs-on: 'ubuntu-latest'
    timeout-minutes: 360
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript']

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Initialize the CodeQL tools for scanning.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@b56ba60b43e5601c701bcbc31f0886acc9244718 # v3.28.10
        with:
          languages: ${{ matrix.language }}
          # If you wish to specify custom queries:
          # queries: security-extended,security-and-quality

      # Autobuild attempts to build any compiled languages.
      # For JS/TS, it usually works out of the box by scanning files.
      - name: Autobuild
        uses: github/codeql-action/autobuild@b56ba60b43e5601c701bcbc31f0886acc9244718 # v3.28.10

      # If Autobuild fails, we can run manual build:
      # - name: Install & Build
      #   run: |
      #     pnpm install --frozen-lockfile
      #     pnpm turbo build

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@b56ba60b43e5601c701bcbc31f0886acc9244718 # v3.28.10
        with:
          category: '/language:${{matrix.language}}'
