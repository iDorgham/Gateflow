# =============================================================================
# lighthouse.yml — GateFlow Lighthouse CI (Target: 100/100)
#
# Plan: pagespeed_100 — Phase 1 infrastructure
#
# Jobs:
#   lighthouse-marketing   → audit marketing site (Mobile + Desktop)
#   lighthouse-dashboard   → audit client dashboard (Desktop)
#   lhci-gate              → summary required-status check
#
# Runs on:
#   - PRs targeting main/master (when frontend files change)
#   - Daily at 06:00 UTC (regression guard)
#   - Manual dispatch with URL + strategy override
#
# Reports:
#   - Scores posted as PR comment (updated, not duplicated)
#   - HTML report uploaded as artifact (7-day retention)
#   - Fails CI if any category < threshold in .lighthouserc.js
#   - CWV metrics printed to step summary
# =============================================================================
name: Lighthouse CI

permissions:
  contents: read

on:
  pull_request:
    branches: [main, master]
    paths:
      - 'apps/client-dashboard/**'
      - 'apps/marketing/**'
      - 'packages/ui/**'
      - '.lighthouserc.js'
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      marketing_url:
        description: 'Marketing site URL to audit'
        required: false
        default: 'https://gateflow.app'
      dashboard_url:
        description: 'Dashboard URL to audit'
        required: false
        default: 'https://app.gateflow.app'
      strategy:
        description: 'mobile or desktop'
        required: false
        default: 'mobile'

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: '8.15.0'
  LHCI_VERSION: '0.14.0'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # ── 1. Audit Marketing Site ────────────────────────────────────────────────
  lighthouse-marketing:
    name: Lighthouse — Marketing (Mobile + Desktop)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install @lhci/cli
        run: |
          npm install -g @lhci/cli@${{ env.LHCI_VERSION }} || {
            echo "❌ LHCI CLI installation failed"
            exit 1
          }
          lhci --version
          which lhci

      - name: Install Chrome
        uses: browser-actions/setup-chrome@4f8e94349a351df0f048634f25fec36c3c91eded # v2.1.1

      - name: Verify Chrome installation
        run: |
          which google-chrome || which chrome || which chromium || which chromium-browser || {
            echo "❌ Chrome not found in PATH"
            exit 1
          }
          # Try to get version from whatever we found
          (google-chrome --version || chrome --version || chromium --version || chromium-browser --version) 2>/dev/null || echo "Could not determine version"

      - name: Determine target URL
        id: url
        run: |
          URL="${{ github.event.inputs.marketing_url }}"
          if [ -z "$URL" ]; then
            # On PRs: use Vercel preview URL if available, else production
            URL="${VERCEL_PREVIEW_URL:-https://gateflow.app}"
          fi
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "Auditing marketing: $URL"
          curl -I "$URL" || echo "⚠ Warning: URL may be unreachable"

      # ── Mobile audit ──
      - name: Run Lighthouse — Mobile
        id: lh_mobile
        run: |
          set +e
          lhci autorun \
            --collect.url="${{ steps.url.outputs.url }}" \
            --collect.url="${{ steps.url.outputs.url }}/en/features" \
            --collect.url="${{ steps.url.outputs.url }}/en/pricing" \
            --collect.settings.emulatedFormFactor=mobile \
            --collect.numberOfRuns=3 \
            --collect.settings.chromeFlags="--no-sandbox --disable-dev-shm-usage" \
            --assert.assertions.categories:performance="['error',{'minScore':0.65}]" \
            --assert.assertions.categories:accessibility="['error',{'minScore':0.85}]" \
            --assert.assertions.categories:best-practices="['error',{'minScore':0.88}]" \
            --assert.assertions.categories:seo="['error',{'minScore':0.90}]" \
            --assert.assertions.cumulative-layout-shift="['error',{'maxNumericValue':0.15}]" \
            --upload.target=temporary-public-storage \
            --config=.lighthouserc.js
          EXIT_CODE=$?
          set -e

          echo "LHCI exit code: $EXIT_CODE"
          mkdir -p lhci-reports/marketing-mobile
          if [ -d ".lighthouseci" ]; then
            cp -r .lighthouseci/* lhci-reports/marketing-mobile/
            ls -la lhci-reports/marketing-mobile/
          else
            echo "⚠ Warning: .lighthouseci directory not created"
          fi
          exit $EXIT_CODE

      # ── Desktop audit ──
      - name: Run Lighthouse — Desktop
        id: lh_desktop
        run: |
          set +e
          lhci autorun \
            --collect.url="${{ steps.url.outputs.url }}" \
            --collect.settings.emulatedFormFactor=desktop \
            --collect.numberOfRuns=3 \
            --collect.settings.chromeFlags="--no-sandbox --disable-dev-shm-usage" \
            --upload.target=temporary-public-storage \
            --config=.lighthouserc.js
          EXIT_CODE=$?
          set -e

          echo "LHCI exit code: $EXIT_CODE"
          mkdir -p lhci-reports/marketing-desktop
          if [ -d ".lighthouseci" ]; then
            cp -r .lighthouseci/* lhci-reports/marketing-desktop/
          else
            echo "⚠ Warning: .lighthouseci directory not created"
          fi
          exit $EXIT_CODE

      # ── Debug — List artifacts ──
      - name: Debug — List artifacts
        if: always()
        run: |
          echo "=== lhci-reports structure ==="
          find lhci-reports -type f 2>/dev/null || echo "lhci-reports directory not found"
          echo "=== .lighthouseci contents ==="
          ls -la .lighthouseci 2>/dev/null || echo ".lighthouseci directory not found"

      # ── Print CWV metrics to step summary ──
      - name: Print score summary
        if: always()
        run: |
          node - <<'EOF'
          const fs = require('fs');
          const path = require('path');

          const dirs = ['lhci-reports/marketing-mobile', 'lhci-reports/marketing-desktop'];
          for (const dir of dirs) {
            if (!fs.existsSync(dir)) continue;
            const files = fs.readdirSync(dir).filter(f => f.startsWith('lhr-') && f.endsWith('.json'));
            if (!files.length) continue;
            const report = JSON.parse(fs.readFileSync(path.join(dir, files[0])));
            const cats = report.categories || {};
            const audits = report.audits || {};
            const fmt = n => n != null ? Math.round(n) : '—';
            const label = dir.includes('mobile') ? '📱 Mobile' : '🖥 Desktop';
            console.log(`\n${label} — ${report.finalUrl}`);
            console.log(`  Performance:    ${fmt((cats.performance?.score ?? 0) * 100)}/100`);
            console.log(`  Accessibility:  ${fmt((cats.accessibility?.score ?? 0) * 100)}/100`);
            console.log(`  Best Practices: ${fmt((cats['best-practices']?.score ?? 0) * 100)}/100`);
            console.log(`  SEO:            ${fmt((cats.seo?.score ?? 0) * 100)}/100`);
            console.log(`  LCP:            ${fmt(audits['largest-contentful-paint']?.numericValue)}ms`);
            console.log(`  FCP:            ${fmt(audits['first-contentful-paint']?.numericValue)}ms`);
            console.log(`  TBT:            ${fmt(audits['total-blocking-time']?.numericValue)}ms`);
            console.log(`  CLS:            ${(audits['cumulative-layout-shift']?.numericValue ?? 0).toFixed(3)}`);
          }
          EOF

      # ── Upload HTML reports as artifact ──
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.0
        with:
          name: lighthouse-marketing-${{ github.run_number }}
          path: lhci-reports/
          retention-days: 7

      # ── Post/update PR comment with scores ──
      - name: Comment Lighthouse scores on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            function getScores(dir) {
              if (!fs.existsSync(dir)) return null;
              const files = fs.readdirSync(dir).filter(f => f.startsWith('lhr-') && f.endsWith('.json'));
              if (!files.length) return null;
              const report = JSON.parse(fs.readFileSync(path.join(dir, files[0])));
              const cats = report.categories || {};
              const audits = report.audits || {};
              const s = key => Math.round((cats[key]?.score ?? 0) * 100);
              const a = key => Math.round(audits[key]?.numericValue ?? 0);
              return {
                perf: s('performance'), a11y: s('accessibility'),
                bp: s('best-practices'), seo: s('seo'),
                lcp: a('largest-contentful-paint'),
                fcp: a('first-contentful-paint'),
                tbt: a('total-blocking-time'),
                cls: (audits['cumulative-layout-shift']?.numericValue ?? 0).toFixed(3),
              };
            }

            const mobile = getScores('lhci-reports/marketing-mobile');
            const desktop = getScores('lhci-reports/marketing-desktop');

            const em = s => s >= 95 ? '🟢' : s >= 80 ? '🟡' : '🔴';
            const row = (label, m, d, key) =>
              `| ${label} | ${m ? em(m[key]) + ' **' + m[key] + '**/100' : '—'} | ${d ? em(d[key]) + ' **' + d[key] + '**/100' : '—'} |`;

            const body = [
              '<!-- lighthouse-ci-comment -->',
              '## Lighthouse CI — Marketing Site',
              '',
              '| Category | 📱 Mobile | 🖥 Desktop |',
              '|----------|-----------|------------|',
              row('Performance',    mobile, desktop, 'perf'),
              row('Accessibility',  mobile, desktop, 'a11y'),
              row('Best Practices', mobile, desktop, 'bp'),
              row('SEO',            mobile, desktop, 'seo'),
              '',
              '**Core Web Vitals (Mobile)**',
              mobile ? `LCP: ${mobile.lcp}ms | FCP: ${mobile.fcp}ms | TBT: ${mobile.tbt}ms | CLS: ${mobile.cls}` : '—',
              '',
              `> Plan: \`pagespeed_100\` — Target: 100/100 all categories`,
              `> Thresholds in [\`.lighthouserc.js\`](.lighthouserc.js)`,
            ].join('\n');

            // Find and update existing bot comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body?.includes('<!-- lighthouse-ci-comment -->'));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body,
              });
            }

  # ── 2. Audit Client Dashboard ──────────────────────────────────────────────
  lighthouse-dashboard:
    name: Lighthouse — Client Dashboard (Desktop)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install @lhci/cli
        run: npm install -g @lhci/cli@${{ env.LHCI_VERSION }}

      - uses: browser-actions/setup-chrome@4f8e94349a351df0f048634f25fec36c3c91eded # v2.1.1

      - name: Verify Chrome installation
        run: |
          which google-chrome || which chrome || which chromium || which chromium-browser || {
            echo "❌ Chrome not found in PATH"
            exit 1
          }

      - name: Determine dashboard URL
        id: url
        run: |
          URL="${{ github.event.inputs.dashboard_url }}"
          if [ -z "$URL" ]; then
            URL="${VERCEL_PREVIEW_URL:-https://app.gateflow.app}"
          fi
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "Auditing dashboard: $URL"
          curl -I "$URL" || echo "⚠ Warning: URL may be unreachable"

      - name: Run Lighthouse — Desktop
        run: |
          set +e
          lhci autorun \
            --collect.url="${{ steps.url.outputs.url }}/en" \
            --collect.settings.emulatedFormFactor=desktop \
            --collect.numberOfRuns=3 \
            --collect.settings.chromeFlags="--no-sandbox --disable-dev-shm-usage" \
            --upload.target=temporary-public-storage \
            --config=.lighthouserc.js
          EXIT_CODE=$?
          set -e

          echo "LHCI exit code: $EXIT_CODE"
          mkdir -p lhci-reports/dashboard-desktop
          if [ -d ".lighthouseci" ]; then
            cp -r .lighthouseci/* lhci-reports/dashboard-desktop/
          else
            echo "⚠ Warning: .lighthouseci directory not created"
          fi
          exit $EXIT_CODE

      - name: Print score summary
        if: always()
        run: |
          node - <<'EOF'
          const fs = require('fs'), path = require('path');
          const dir = 'lhci-reports/dashboard-desktop';
          if (!fs.existsSync(dir)) { console.log('No report found'); process.exit(0); }
          const files = fs.readdirSync(dir).filter(f => f.startsWith('lhr-') && f.endsWith('.json'));
          if (!files.length) { console.log('No LHR reports'); process.exit(0); }
          const r = JSON.parse(fs.readFileSync(path.join(dir, files[0])));
          const c = r.categories || {}, a = r.audits || {};
          console.log('\n🖥 Dashboard Desktop —', r.finalUrl);
          console.log('  Performance:   ', Math.round((c.performance?.score ?? 0) * 100) + '/100');
          console.log('  Accessibility: ', Math.round((c.accessibility?.score ?? 0) * 100) + '/100');
          console.log('  Best Practices:', Math.round((c['best-practices']?.score ?? 0) * 100) + '/100');
          console.log('  LCP:           ', Math.round(a['largest-contentful-paint']?.numericValue ?? 0) + 'ms');
          console.log('  TBT:           ', Math.round(a['total-blocking-time']?.numericValue ?? 0) + 'ms');
          console.log('  CLS:           ', (a['cumulative-layout-shift']?.numericValue ?? 0).toFixed(3));
          EOF

      - name: Upload Dashboard reports
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.0
        with:
          name: lighthouse-dashboard-${{ github.run_number }}
          path: lhci-reports/
          retention-days: 7

  # ── 3. Required status gate ────────────────────────────────────────────────
  lhci-gate:
    name: Lighthouse Gate
    if: always()
    needs: [lighthouse-marketing, lighthouse-dashboard]
    runs-on: ubuntu-latest
    steps:
      - name: Check Lighthouse jobs
        run: |
          MARKETING="${{ needs.lighthouse-marketing.result }}"
          DASHBOARD="${{ needs.lighthouse-dashboard.result }}"

          echo "Marketing: $MARKETING"
          echo "Dashboard: $DASHBOARD"

          # Only fail on hard failures (not continue-on-error passes)
          if [[ "$MARKETING" == "failure" || "$DASHBOARD" == "failure" ]]; then
            echo "A Lighthouse job hard-failed. Check logs above."
            exit 1
          fi

          echo "Lighthouse CI complete. Review scores in job logs and PR comment."
