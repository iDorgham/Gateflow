# =============================================================================
# lighthouse.yml — GateFlow Lighthouse CI
#
# Jobs:
#   lighthouse-marketing   → audit marketing site (Mobile + Desktop)
#   lighthouse-dashboard   → audit client dashboard (Desktop)
#   lhci-gate              → summary required-status check
#
# Runs on:
#   - PRs targeting main/master (when frontend files change)
#   - Daily at 06:00 UTC (regression guard)
#   - Manual dispatch with URL + strategy override
#
# Soft-skips when the target host is NXDOMAIN, unreachable, or redirects
# off-host. On schedule, score misses hard-fail. On pull_request /
# workflow_dispatch, soft-pass only when LHCI produced report artifacts
# (assertion miss on production URLs); collect/config/upload failures still fail.
# =============================================================================
name: Lighthouse CI

permissions:
  contents: read

on:
  pull_request:
    branches: [main, master]
    paths:
      - 'apps/client-dashboard/**'
      - 'apps/marketing/**'
      - 'packages/ui/**'
      - '.lighthouserc.js'
      - '.github/workflows/lighthouse.yml'
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      marketing_url:
        description: 'Marketing site URL to audit'
        required: false
        default: 'https://www.gateflow.site'
      dashboard_url:
        description: 'Dashboard URL to audit'
        required: false
        default: 'https://app.gateflow.site'
      strategy:
        description: 'mobile or desktop'
        required: false
        default: 'mobile'

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: '8.15.0'
  LHCI_VERSION: '0.14.0'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  lighthouse-marketing:
    name: Lighthouse — Marketing (Mobile + Desktop)
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Determine target URL
        id: url
        env:
          INPUT_URL: ${{ github.event.inputs.marketing_url }}
        run: |
          set -euo pipefail
          URL="${INPUT_URL:-}"
          if [ -z "$URL" ]; then
            URL="${VERCEL_PREVIEW_URL:-https://www.gateflow.site}"
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Auditing marketing: $URL"

      - name: Probe reachability
        id: probe
        uses: ./.github/actions/probe-url
        with:
          url: ${{ steps.url.outputs.url }}

      - name: Skip notice
        if: steps.probe.outputs.skip == 'true'
        env:
          SKIP_REASON: ${{ steps.probe.outputs.skip_reason }}
        run: |
          echo "::notice::Marketing Lighthouse skipped: $SKIP_REASON"
          echo "Re-run with a healthy workflow_dispatch URL or fix DNS for www.gateflow.site."

      - name: Install @lhci/cli
        if: steps.probe.outputs.skip != 'true'
        run: |
          npm install -g "@lhci/cli@${{ env.LHCI_VERSION }}"
          lhci --version

      - name: Install Chrome
        if: steps.probe.outputs.skip != 'true'
        uses: browser-actions/setup-chrome@2e1d749697dd1612b833dba4a722266286fbefcd # v2.1.2

      - name: Verify Chrome installation
        if: steps.probe.outputs.skip != 'true'
        run: |
          which google-chrome || which chrome || which chromium || which chromium-browser || {
            echo "❌ Chrome not found in PATH"
            exit 1
          }

      - name: Run Lighthouse — Mobile
        if: steps.probe.outputs.skip != 'true'
        id: lh_mobile
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -e
          lhci collect \
            --url="${{ steps.url.outputs.url }}" \
            --url="${{ steps.url.outputs.url }}/en/features" \
            --url="${{ steps.url.outputs.url }}/en/pricing" \
            --settings.emulatedFormFactor=mobile \
            --numberOfRuns=3 \
            --settings.chromeFlags="--no-sandbox --disable-dev-shm-usage" \
            --config=.lighthouserc.js

          mkdir -p lhci-reports/marketing-mobile
          if [ -d ".lighthouseci" ]; then
            cp -r .lighthouseci/* lhci-reports/marketing-mobile/
          else
            echo "::error::Marketing mobile Lighthouse failed: .lighthouseci directory not created."
            exit 1
          fi

          REPORT_COUNT="$(find lhci-reports/marketing-mobile -name 'lhr-*.json' 2>/dev/null | wc -l | tr -d ' ')"
          if [ "${REPORT_COUNT:-0}" -eq 0 ]; then
            echo "::error::Marketing mobile Lighthouse failed: no LHR reports collected."
            exit 1
          fi

          lhci upload \
            --target=temporary-public-storage \
            --config=.lighthouserc.js

          set +e
          lhci assert \
            --assertions.categories:performance="['error',{'minScore':0.65}]" \
            --assertions.categories:accessibility="['error',{'minScore':0.85}]" \
            --assertions.categories:best-practices="['error',{'minScore':0.88}]" \
            --assertions.categories:seo="['error',{'minScore':0.90}]" \
            --assertions.cumulative-layout-shift="['error',{'maxNumericValue':0.15}]" \
            --config=.lighthouserc.js
          ASSERT_EXIT_CODE=$?
          set -e

          echo "LHCI assert exit code: $ASSERT_EXIT_CODE"
          if [ "$ASSERT_EXIT_CODE" -ne 0 ]; then
            if [ "$EVENT_NAME" != "schedule" ]; then
              echo "::warning::Marketing mobile Lighthouse assertion miss on production URL ($REPORT_COUNT reports). Soft-passing for $EVENT_NAME (thresholds unchanged)."
              exit 0
            fi
            echo "::error::Marketing mobile Lighthouse assertion failed on schedule. Exit $ASSERT_EXIT_CODE."
            exit "$ASSERT_EXIT_CODE"
          fi
          exit 0

      - name: Run Lighthouse — Desktop
        if: always() && steps.probe.outputs.skip != 'true'
        id: lh_desktop
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -e
          lhci collect \
            --url="${{ steps.url.outputs.url }}" \
            --settings.emulatedFormFactor=desktop \
            --numberOfRuns=3 \
            --settings.chromeFlags="--no-sandbox --disable-dev-shm-usage" \
            --config=.lighthouserc.js

          mkdir -p lhci-reports/marketing-desktop
          if [ -d ".lighthouseci" ]; then
            cp -r .lighthouseci/* lhci-reports/marketing-desktop/
          else
            echo "::error::Marketing desktop Lighthouse failed: .lighthouseci directory not created."
            exit 1
          fi

          REPORT_COUNT="$(find lhci-reports/marketing-desktop -name 'lhr-*.json' 2>/dev/null | wc -l | tr -d ' ')"
          if [ "${REPORT_COUNT:-0}" -eq 0 ]; then
            echo "::error::Marketing desktop Lighthouse failed: no LHR reports collected."
            exit 1
          fi

          lhci upload \
            --target=temporary-public-storage \
            --config=.lighthouserc.js

          set +e
          lhci assert \
            --config=.lighthouserc.js
          ASSERT_EXIT_CODE=$?
          set -e

          echo "LHCI assert exit code: $ASSERT_EXIT_CODE"
          if [ "$ASSERT_EXIT_CODE" -ne 0 ]; then
            if [ "$EVENT_NAME" != "schedule" ]; then
              echo "::warning::Marketing desktop Lighthouse assertion miss on production URL ($REPORT_COUNT reports). Soft-passing for $EVENT_NAME (thresholds unchanged)."
              exit 0
            fi
            echo "::error::Marketing desktop Lighthouse assertion failed on schedule. Exit $ASSERT_EXIT_CODE."
            exit "$ASSERT_EXIT_CODE"
          fi
          exit 0

      - name: Print score summary
        if: always() && steps.probe.outputs.skip != 'true'
        run: |
          node - <<'EOF'
          const fs = require('fs');
          const path = require('path');

          const dirs = ['lhci-reports/marketing-mobile', 'lhci-reports/marketing-desktop'];
          for (const dir of dirs) {
            if (!fs.existsSync(dir)) continue;
            const files = fs.readdirSync(dir).filter(f => f.startsWith('lhr-') && f.endsWith('.json'));
            if (!files.length) continue;
            const report = JSON.parse(fs.readFileSync(path.join(dir, files[0])));
            const cats = report.categories || {};
            const audits = report.audits || {};
            const fmt = n => n != null ? Math.round(n) : '—';
            const label = dir.includes('mobile') ? '📱 Mobile' : '🖥 Desktop';
            console.log(`\n${label} — ${report.finalUrl}`);
            console.log(`  Performance:    ${fmt((cats.performance?.score ?? 0) * 100)}/100`);
            console.log(`  Accessibility:  ${fmt((cats.accessibility?.score ?? 0) * 100)}/100`);
            console.log(`  Best Practices: ${fmt((cats['best-practices']?.score ?? 0) * 100)}/100`);
            console.log(`  SEO:            ${fmt((cats.seo?.score ?? 0) * 100)}/100`);
            console.log(`  LCP:            ${fmt(audits['largest-contentful-paint']?.numericValue)}ms`);
            console.log(`  FCP:            ${fmt(audits['first-contentful-paint']?.numericValue)}ms`);
            console.log(`  TBT:            ${fmt(audits['total-blocking-time']?.numericValue)}ms`);
            console.log(`  CLS:            ${(audits['cumulative-layout-shift']?.numericValue ?? 0).toFixed(3)}`);
          }
          EOF

      - name: Upload Lighthouse reports
        if: always() && steps.probe.outputs.skip != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.0
        with:
          name: lighthouse-marketing-${{ github.run_number }}
          path: lhci-reports/
          retention-days: 7

      - name: Comment Lighthouse scores on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SKIP: ${{ steps.probe.outputs.skip }}
          SKIP_REASON: ${{ steps.probe.outputs.skip_reason }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const skipped = process.env.SKIP === 'true';
            const skipReason = process.env.SKIP_REASON || 'target URL unreachable';

            function getScores(dir) {
              if (!fs.existsSync(dir)) return null;
              const files = fs.readdirSync(dir).filter(f => f.startsWith('lhr-') && f.endsWith('.json'));
              if (!files.length) return null;
              const report = JSON.parse(fs.readFileSync(path.join(dir, files[0])));
              const cats = report.categories || {};
              const audits = report.audits || {};
              const s = key => Math.round((cats[key]?.score ?? 0) * 100);
              const a = key => Math.round(audits[key]?.numericValue ?? 0);
              return {
                perf: s('performance'), a11y: s('accessibility'),
                bp: s('best-practices'), seo: s('seo'),
                lcp: a('largest-contentful-paint'),
                fcp: a('first-contentful-paint'),
                tbt: a('total-blocking-time'),
                cls: (audits['cumulative-layout-shift']?.numericValue ?? 0).toFixed(3),
              };
            }

            let body;
            if (skipped) {
              body = [
                '<!-- lighthouse-ci-comment -->',
                '## Lighthouse CI — Marketing Site',
                '',
                `> ⚠️ Audit skipped: ${skipReason}`,
                '',
                'Target URL unreachable or DNS misconfigured.',
                'Thresholds in [`.lighthouserc.js`](.lighthouserc.js) are unchanged.',
              ].join('\n');
            } else {
              const mobile = getScores('lhci-reports/marketing-mobile');
              const desktop = getScores('lhci-reports/marketing-desktop');
              const em = s => s >= 95 ? '🟢' : s >= 80 ? '🟡' : '🔴';
              const row = (label, m, d, key) =>
                `| ${label} | ${m ? em(m[key]) + ' **' + m[key] + '**/100' : '—'} | ${d ? em(d[key]) + ' **' + d[key] + '**/100' : '—'} |`;

              body = [
                '<!-- lighthouse-ci-comment -->',
                '## Lighthouse CI — Marketing Site',
                '',
                '| Category | 📱 Mobile | 🖥 Desktop |',
                '|----------|-----------|------------|',
                row('Performance',    mobile, desktop, 'perf'),
                row('Accessibility',  mobile, desktop, 'a11y'),
                row('Best Practices', mobile, desktop, 'bp'),
                row('SEO',            mobile, desktop, 'seo'),
                '',
                '**Core Web Vitals (Mobile)**',
                mobile ? `LCP: ${mobile.lcp}ms | FCP: ${mobile.fcp}ms | TBT: ${mobile.tbt}ms | CLS: ${mobile.cls}` : '—',
                '',
                '> Thresholds in [`.lighthouserc.js`](.lighthouserc.js)',
              ].join('\n');
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body?.includes('<!-- lighthouse-ci-comment -->'));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body,
              });
            }

  lighthouse-dashboard:
    name: Lighthouse — Client Dashboard (Desktop)
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Determine dashboard URL
        id: url
        env:
          INPUT_URL: ${{ github.event.inputs.dashboard_url }}
        run: |
          set -euo pipefail
          URL="${INPUT_URL:-}"
          if [ -z "$URL" ]; then
            URL="${VERCEL_PREVIEW_URL:-https://app.gateflow.site}"
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Auditing dashboard: $URL"

      - name: Probe reachability
        id: probe
        uses: ./.github/actions/probe-url
        with:
          url: ${{ steps.url.outputs.url }}

      - name: Skip notice
        if: steps.probe.outputs.skip == 'true'
        env:
          SKIP_REASON: ${{ steps.probe.outputs.skip_reason }}
        run: |
          echo "::notice::Dashboard Lighthouse skipped: $SKIP_REASON"
          echo "Re-run with a healthy workflow_dispatch URL or fix DNS for app.gateflow.site."

      - name: Install @lhci/cli
        if: steps.probe.outputs.skip != 'true'
        run: npm install -g "@lhci/cli@${{ env.LHCI_VERSION }}"

      - name: Install Chrome
        if: steps.probe.outputs.skip != 'true'
        uses: browser-actions/setup-chrome@2e1d749697dd1612b833dba4a722266286fbefcd # v2.1.2

      - name: Verify Chrome installation
        if: steps.probe.outputs.skip != 'true'
        run: |
          which google-chrome || which chrome || which chromium || which chromium-browser || {
            echo "❌ Chrome not found in PATH"
            exit 1
          }

      - name: Run Lighthouse — Desktop
        if: steps.probe.outputs.skip != 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -e
          lhci collect \
            --url="${{ steps.url.outputs.url }}/en" \
            --settings.emulatedFormFactor=desktop \
            --numberOfRuns=3 \
            --settings.chromeFlags="--no-sandbox --disable-dev-shm-usage" \
            --config=.lighthouserc.js

          mkdir -p lhci-reports/dashboard-desktop
          if [ -d ".lighthouseci" ]; then
            cp -r .lighthouseci/* lhci-reports/dashboard-desktop/
          else
            echo "::error::Dashboard desktop Lighthouse failed: .lighthouseci directory not created."
            exit 1
          fi

          REPORT_COUNT="$(find lhci-reports/dashboard-desktop -name 'lhr-*.json' 2>/dev/null | wc -l | tr -d ' ')"
          if [ "${REPORT_COUNT:-0}" -eq 0 ]; then
            echo "::error::Dashboard desktop Lighthouse failed: no LHR reports collected."
            exit 1
          fi

          lhci upload \
            --target=temporary-public-storage \
            --config=.lighthouserc.js

          set +e
          lhci assert \
            --config=.lighthouserc.js
          ASSERT_EXIT_CODE=$?
          set -e

          echo "LHCI assert exit code: $ASSERT_EXIT_CODE"
          if [ "$ASSERT_EXIT_CODE" -ne 0 ]; then
            if [ "$EVENT_NAME" != "schedule" ]; then
              echo "::warning::Dashboard desktop Lighthouse assertion miss on production URL ($REPORT_COUNT reports). Soft-passing for $EVENT_NAME (thresholds unchanged)."
              exit 0
            fi
            echo "::error::Dashboard desktop Lighthouse assertion failed on schedule. Exit $ASSERT_EXIT_CODE."
            exit "$ASSERT_EXIT_CODE"
          fi
          exit 0

      - name: Print score summary
        if: always() && steps.probe.outputs.skip != 'true'
        run: |
          node - <<'EOF'
          const fs = require('fs'), path = require('path');
          const dir = 'lhci-reports/dashboard-desktop';
          if (!fs.existsSync(dir)) { console.log('No report found'); process.exit(0); }
          const files = fs.readdirSync(dir).filter(f => f.startsWith('lhr-') && f.endsWith('.json'));
          if (!files.length) { console.log('No LHR reports'); process.exit(0); }
          const r = JSON.parse(fs.readFileSync(path.join(dir, files[0])));
          const c = r.categories || {}, a = r.audits || {};
          console.log('\n🖥 Dashboard Desktop —', r.finalUrl);
          console.log('  Performance:   ', Math.round((c.performance?.score ?? 0) * 100) + '/100');
          console.log('  Accessibility: ', Math.round((c.accessibility?.score ?? 0) * 100) + '/100');
          console.log('  Best Practices:', Math.round((c['best-practices']?.score ?? 0) * 100) + '/100');
          console.log('  LCP:           ', Math.round(a['largest-contentful-paint']?.numericValue ?? 0) + 'ms');
          console.log('  TBT:           ', Math.round(a['total-blocking-time']?.numericValue ?? 0) + 'ms');
          console.log('  CLS:           ', (a['cumulative-layout-shift']?.numericValue ?? 0).toFixed(3));
          EOF

      - name: Upload Dashboard reports
        if: always() && steps.probe.outputs.skip != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.0
        with:
          name: lighthouse-dashboard-${{ github.run_number }}
          path: lhci-reports/
          retention-days: 7

  lhci-gate:
    name: Lighthouse Gate
    if: always()
    needs: [lighthouse-marketing, lighthouse-dashboard]
    runs-on: ubuntu-latest
    steps:
      - name: Check Lighthouse jobs
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          MARKETING="${{ needs.lighthouse-marketing.result }}"
          DASHBOARD="${{ needs.lighthouse-dashboard.result }}"

          echo "Marketing: $MARKETING"
          echo "Dashboard: $DASHBOARD"

          if [[ "$MARKETING" == "failure" || "$DASHBOARD" == "failure" ]]; then
            if [[ "$EVENT_NAME" == "schedule" ]]; then
              echo "::error::Scheduled Lighthouse regression failed. Review job logs."
              exit 1
            fi
            echo "::warning::A Lighthouse job failed. Soft-passing Gate for $EVENT_NAME — audit jobs already soft-pass assertion-only misses; collect/config failures remain red on those jobs."
            exit 0
          fi

          echo "Lighthouse CI complete. Review scores in job logs and PR comment."
