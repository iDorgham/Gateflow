# =============================================================================
# deploy.yml — GateFlow Vercel Deployment
#
# Deploys all web apps to Vercel:
#   - client-dashboard  (production / preview)
#   - admin-dashboard   (production / preview)
#   - marketing         (production / preview)
#   - resident-portal   (production / preview)
#
# Triggers:
#   - Push to main/master → production deploy
#   - Pull request        → preview deploy
#   - Manual dispatch
#
# Required secrets (set in GitHub → Settings → Secrets):
#   VERCEL_TOKEN
#   VERCEL_ORG_ID
#   VERCEL_PROJECT_ID_CLIENT_DASHBOARD
#   VERCEL_PROJECT_ID_ADMIN_DASHBOARD
#   VERCEL_PROJECT_ID_MARKETING
#   VERCEL_PROJECT_ID_RESIDENT_PORTAL
# =============================================================================
name: Deploy

permissions:
  contents: read

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      app:
        description: 'App to deploy (leave empty for all)'
        required: false
        default: ''
      environment:
        description: 'Environment (production | preview)'
        required: false
        default: 'production'

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  PNPM_VERSION: '8.15.0'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # ── Filter changes ──────────────────────────────────────────────────────────
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    outputs:
      client: ${{ steps.filter.outputs.client }}
      admin: ${{ steps.filter.outputs.admin }}
      marketing: ${{ steps.filter.outputs.marketing }}
      resident: ${{ steps.filter.outputs.resident }}
      db: ${{ steps.filter.outputs.db }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            client:
              - 'apps/client-dashboard/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
            admin:
              - 'apps/admin-dashboard/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
            marketing:
              - 'apps/marketing/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
            resident:
              - 'apps/resident-portal/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
            db:
              - 'packages/db/**'
              - 'package.json'
              - 'pnpm-lock.yaml'

  # ── Build check before deploy ─────────────────────────────────────────────
  build-check:
    name: Build Check
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@0c17529a66aca453f9227af23103ed11469b1e47 # v4.0.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @gate-access/db db:generate
        env:
          DATABASE_URL: 'postgresql://placeholder:placeholder@localhost:5432/placeholder'
          ACCELERATE_URL: 'false'

      - name: Build all web apps
        run: pnpm turbo build --filter=client-dashboard --filter=admin-dashboard --filter=marketing --filter=resident-portal
        env:
          ACCELERATE_URL: 'false'
          DATABASE_URL: 'postgresql://placeholder:placeholder@localhost:5432/placeholder'
          SKIP_ENV_VALIDATION: 'true'
          NEXT_TELEMETRY_DISABLED: '1'
          STATSIG_SERVER_API_KEY: 'placeholder'
          EXPERIMENTATION_CONFIG_ITEM_KEY: 'placeholder'
          tune_EXPERIMENTATION_CONFIG_ITEM_KEY: 'placeholder'

  # ── Database Migration ────────────────────────────────────────────────────
  db-migrate:
    name: Database Migration
    needs: [changes, build-check]
    runs-on: ubuntu-latest
    if: |
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') &&
      needs.changes.outputs.db == 'true'
    environment:
      name: production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: pnpm/action-setup@0c17529a66aca453f9227af23103ed11469b1e47 # v4.0.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run database migration
        run: pnpm --filter @gate-access/db exec prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}

  # ── Deploy: client-dashboard ──────────────────────────────────────────────
  deploy-client:
    name: Deploy client-dashboard
    needs: [changes, build-check, db-migrate]
    runs-on: ubuntu-latest
    if: |
      always() &&
      !cancelled() &&
      !failure() &&
      (needs.db-migrate.result == 'success' || needs.db-migrate.result == 'skipped') &&
      (github.event.inputs.app == '' || github.event.inputs.app == 'client-dashboard') &&
      needs.changes.outputs.client == 'true'
    environment:
      name: "${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && 'production' || 'preview' }}"
      url: '${{ steps.deploy.outputs.url }}'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pull Vercel environment
        run: |
          vercel pull --yes \
            --environment=${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && 'production' || 'preview' }} \
            --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: apps/client-dashboard
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_CLIENT_DASHBOARD }}

      - name: Build for Vercel
        run: "vercel build ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}"
        working-directory: apps/client-dashboard
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_CLIENT_DASHBOARD }}

      - name: Deploy to Vercel
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt \
            ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && '--prod' || '' }} \
            --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "Deployed to: $URL"
        working-directory: apps/client-dashboard
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_CLIENT_DASHBOARD }}

  # ── Deploy: admin-dashboard ───────────────────────────────────────────────
  deploy-admin:
    name: Deploy admin-dashboard
    needs: [changes, build-check, db-migrate]
    runs-on: ubuntu-latest
    if: |
      always() &&
      !cancelled() &&
      !failure() &&
      (needs.db-migrate.result == 'success' || needs.db-migrate.result == 'skipped') &&
      (github.event.inputs.app == '' || github.event.inputs.app == 'admin-dashboard') &&
      needs.changes.outputs.admin == 'true'
    environment:
      name: "${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && 'production' || 'preview' }}"
      url: '${{ steps.deploy.outputs.url }}'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pull Vercel environment
        run: |
          vercel pull --yes \
            --environment=${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && 'production' || 'preview' }} \
            --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: apps/admin-dashboard
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_ADMIN_DASHBOARD }}

      - name: Build for Vercel
        run: "vercel build ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}"
        working-directory: apps/admin-dashboard
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_ADMIN_DASHBOARD }}

      - name: Deploy to Vercel
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt \
            ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && '--prod' || '' }} \
            --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "Deployed to: $URL"
        working-directory: apps/admin-dashboard
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_ADMIN_DASHBOARD }}

  # ── Deploy: marketing ────────────────────────────────────────────────────
  deploy-marketing:
    name: Deploy marketing
    needs: [changes, build-check, db-migrate]
    runs-on: ubuntu-latest
    if: |
      always() &&
      !cancelled() &&
      !failure() &&
      (needs.db-migrate.result == 'success' || needs.db-migrate.result == 'skipped') &&
      (github.event.inputs.app == '' || github.event.inputs.app == 'marketing') &&
      needs.changes.outputs.marketing == 'true'
    environment:
      name: "${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && 'production' || 'preview' }}"
      url: '${{ steps.deploy.outputs.url }}'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pull Vercel environment
        run: |
          vercel pull --yes \
            --environment=${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && 'production' || 'preview' }} \
            --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: apps/marketing
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_MARKETING }}

      - name: Build for Vercel
        run: "vercel build ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}"
        working-directory: apps/marketing
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_MARKETING }}

      - name: Deploy to Vercel
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt \
            ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && '--prod' || '' }} \
            --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "Deployed to: $URL"
        working-directory: apps/marketing
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_MARKETING }}

  # ── Deploy: resident-portal ───────────────────────────────────────────────
  deploy-resident-portal:
    name: Deploy resident-portal
