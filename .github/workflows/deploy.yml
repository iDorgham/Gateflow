# =============================================================================
# deploy.yml — GateFlow Vercel Deployment (manual /deploy only)
#
# Deploys web apps to Vercel via workflow_dispatch (no push auto-deploy).
# Each app uses a GitHub Environment matching Vercel naming so Deployments
# UI and protection rules stay per-app:
#   Production – gateflow-<app> | Preview – gateflow-<app>
#
# Required secrets (repo → Settings → Secrets):
#   VERCEL_TOKEN
#   VERCEL_ORG_ID
#   VERCEL_PROJECT_ID_CLIENT_DASHBOARD
#   VERCEL_PROJECT_ID_ADMIN_DASHBOARD
#   VERCEL_PROJECT_ID_MARKETING
#   VERCEL_PROJECT_ID_RESIDENT_PORTAL
#   VERCEL_PROJECT_ID_DESIGN_SYSTEM
#   DATABASE_URL / DIRECT_DATABASE_URL (db-migrate only)
#
# IMPORTANT: All Vercel projects set Root Directory to apps/<name>.
# Run vercel CLI from the monorepo root (never working-directory: apps/...).
# =============================================================================
name: Deploy

permissions:
  contents: read
  deployments: write

on:
  workflow_dispatch:
    inputs:
      app:
        description: 'App to deploy (all = changed apps only)'
        required: false
        default: all
        type: choice
        options:
          - all
          - client-dashboard
          - admin-dashboard
          - marketing
          - resident-portal
          - design-system
      environment:
        description: 'Environment (production | preview)'
        required: false
        default: 'production'
        type: choice
        options:
          - production
          - preview
      skip_migration:
        description: 'Skip database migration (use when migration is already resolved)'
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-${{ github.ref }}-${{ inputs.app || 'all' }}
  cancel-in-progress: false

env:
  PNPM_VERSION: '8.15.0'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # ── Filter changes ──────────────────────────────────────────────────────────
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    if: vars.DEPLOY_DISABLED != 'true'
    outputs:
      client: ${{ steps.filter.outputs.client }}
      admin: ${{ steps.filter.outputs.admin }}
      marketing: ${{ steps.filter.outputs.marketing }}
      resident: ${{ steps.filter.outputs.resident }}
      design_system: ${{ steps.filter.outputs.design_system }}
      db: ${{ steps.filter.outputs.db }}
      is_prod: ${{ steps.env.outputs.is_prod }}
      vercel_env: ${{ steps.env.outputs.vercel_env }}
      gh_env_prefix: ${{ steps.env.outputs.gh_env_prefix }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve environment
        id: env
        run: |
          set -euo pipefail
          INPUT_ENV="${{ github.event.inputs.environment }}"
          # Explicit preview input wins; otherwise production only on main/master
          if [[ "$INPUT_ENV" == "preview" ]]; then
            echo "is_prod=false" >> "$GITHUB_OUTPUT"
            echo "vercel_env=preview" >> "$GITHUB_OUTPUT"
            echo "gh_env_prefix=Preview" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == "refs/heads/main" || "${{ github.ref }}" == "refs/heads/master" ]]; then
            if [[ "$INPUT_ENV" == "production" || -z "$INPUT_ENV" ]]; then
              echo "is_prod=true" >> "$GITHUB_OUTPUT"
              echo "vercel_env=production" >> "$GITHUB_OUTPUT"
              echo "gh_env_prefix=Production" >> "$GITHUB_OUTPUT"
            else
              echo "is_prod=false" >> "$GITHUB_OUTPUT"
              echo "vercel_env=preview" >> "$GITHUB_OUTPUT"
              echo "gh_env_prefix=Preview" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "is_prod=false" >> "$GITHUB_OUTPUT"
            echo "vercel_env=preview" >> "$GITHUB_OUTPUT"
            echo "gh_env_prefix=Preview" >> "$GITHUB_OUTPUT"
          fi

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            client:
              - 'apps/client-dashboard/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
            admin:
              - 'apps/admin-dashboard/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
            marketing:
              - 'apps/marketing/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
            resident:
              - 'apps/resident-portal/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
            design_system:
              - 'apps/design-system/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
            db:
              - 'packages/db/**'
              - 'package.json'
              - 'pnpm-lock.yaml'

  # ── Build check before deploy ─────────────────────────────────────────────
  build-check:
    name: Build Check
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@0c17529a66aca453f9227af23103ed11469b1e47 # v4.0.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @gate-access/db db:generate
        env:
          DATABASE_URL: 'postgresql://placeholder:placeholder@localhost:5432/placeholder'
          ACCELERATE_URL: 'false'

      - name: Build web apps
        env:
          DEPLOY_APP: ${{ github.event.inputs.app }}
          ACCELERATE_URL: 'false'
          DATABASE_URL: 'postgresql://placeholder:placeholder@localhost:5432/placeholder'
          SKIP_ENV_VALIDATION: 'true'
          NEXT_TELEMETRY_DISABLED: '1'
          STATSIG_SERVER_API_KEY: 'placeholder'
          EXPERIMENTATION_CONFIG_ITEM_KEY: 'placeholder'
          tune_EXPERIMENTATION_CONFIG_ITEM_KEY: 'placeholder'
          # Resident Portal fail-closed upstream (needed when that app is in the build set)
          RESIDENT_API_UPSTREAM: 'https://app.gateflow.site/api'
          NEXT_PUBLIC_API_URL: 'https://app.gateflow.site/api'
        run: |
          set -euo pipefail
          case "${DEPLOY_APP:-all}" in
            client-dashboard) FILTERS=(--filter=client-dashboard) ;;
            admin-dashboard) FILTERS=(--filter=admin-dashboard) ;;
            marketing) FILTERS=(--filter=marketing) ;;
            resident-portal) FILTERS=(--filter=resident-portal) ;;
            design-system) FILTERS=(--filter=@gateflow/design-system) ;;
            *) FILTERS=(
                --filter=client-dashboard
                --filter=admin-dashboard
                --filter=marketing
                --filter=resident-portal
                --filter=@gateflow/design-system
              ) ;;
          esac
          pnpm turbo build "${FILTERS[@]}"

  # ── Database Migration ────────────────────────────────────────────────────
  db-migrate:
    name: Database Migration
    needs: [changes, build-check]
    runs-on: ubuntu-latest
    if: |
      needs.changes.outputs.is_prod == 'true' &&
      needs.changes.outputs.db == 'true' &&
      github.event.inputs.skip_migration != 'true'
    environment:
      name: Production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0c17529a66aca453f9227af23103ed11469b1e47 # v4.0.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run database migration
        run: pnpm --filter @gate-access/db exec prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}

  # ── Deploy: client-dashboard ──────────────────────────────────────────────
  deploy-client:
    name: Deploy client-dashboard
    needs: [changes, build-check, db-migrate]
    runs-on: ubuntu-latest
    if: |
      always() &&
      !cancelled() &&
      !failure() &&
      (needs.db-migrate.result == 'success' || needs.db-migrate.result == 'skipped') &&
      (
        github.event.inputs.app == 'client-dashboard' ||
        ((github.event.inputs.app == 'all' || github.event.inputs.app == '') && needs.changes.outputs.client == 'true')
      )
    environment:
      name: ${{ needs.changes.outputs.gh_env_prefix }} – gateflow-client-dashboard
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pull Vercel environment
        run: |
          vercel pull --yes \
            --environment=${{ needs.changes.outputs.vercel_env }} \
            --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_CLIENT_DASHBOARD }}

      - name: Build for Vercel
        run: vercel build ${{ needs.changes.outputs.is_prod == 'true' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_CLIENT_DASHBOARD }}

      - name: Deploy to Vercel
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt \
            ${{ needs.changes.outputs.is_prod == 'true' && '--prod' || '' }} \
            --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Deployed to: $URL"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_CLIENT_DASHBOARD }}

  # ── Deploy: admin-dashboard ───────────────────────────────────────────────
  deploy-admin:
    name: Deploy admin-dashboard
    needs: [changes, build-check, db-migrate]
    runs-on: ubuntu-latest
    if: |
      always() &&
      !cancelled() &&
      !failure() &&
      (needs.db-migrate.result == 'success' || needs.db-migrate.result == 'skipped') &&
      (
        github.event.inputs.app == 'admin-dashboard' ||
        ((github.event.inputs.app == 'all' || github.event.inputs.app == '') && needs.changes.outputs.admin == 'true')
      )
    environment:
      name: ${{ needs.changes.outputs.gh_env_prefix }} – gateflow-admin-dashboard
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pull Vercel environment
        run: |
          vercel pull --yes \
            --environment=${{ needs.changes.outputs.vercel_env }} \
            --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_ADMIN_DASHBOARD }}

      - name: Build for Vercel
        run: vercel build ${{ needs.changes.outputs.is_prod == 'true' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_ADMIN_DASHBOARD }}

      - name: Deploy to Vercel
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt \
            ${{ needs.changes.outputs.is_prod == 'true' && '--prod' || '' }} \
            --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Deployed to: $URL"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_ADMIN_DASHBOARD }}

  # ── Deploy: marketing ────────────────────────────────────────────────────
  deploy-marketing:
    name: Deploy marketing
    needs: [changes, build-check, db-migrate]
    runs-on: ubuntu-latest
    if: |
      always() &&
      !cancelled() &&
      !failure() &&
      (needs.db-migrate.result == 'success' || needs.db-migrate.result == 'skipped') &&
      (
        github.event.inputs.app == 'marketing' ||
        ((github.event.inputs.app == 'all' || github.event.inputs.app == '') && needs.changes.outputs.marketing == 'true')
      )
    environment:
      name: ${{ needs.changes.outputs.gh_env_prefix }} – gateflow-marketing
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pull Vercel environment
        run: |
          vercel pull --yes \
            --environment=${{ needs.changes.outputs.vercel_env }} \
            --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_MARKETING }}

      - name: Build for Vercel
        run: vercel build ${{ needs.changes.outputs.is_prod == 'true' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_MARKETING }}

      - name: Deploy to Vercel
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt \
            ${{ needs.changes.outputs.is_prod == 'true' && '--prod' || '' }} \
            --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Deployed to: $URL"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_MARKETING }}

  # ── Deploy: resident-portal ───────────────────────────────────────────────
  deploy-resident-portal:
    name: Deploy resident-portal
    needs: [changes, build-check, db-migrate]
    runs-on: ubuntu-latest
    if: |
      always() &&
      !cancelled() &&
      !failure() &&
      (needs.db-migrate.result == 'success' || needs.db-migrate.result == 'skipped') &&
      (
        github.event.inputs.app == 'resident-portal' ||
        ((github.event.inputs.app == 'all' || github.event.inputs.app == '') && needs.changes.outputs.resident == 'true')
      )
    environment:
      name: ${{ needs.changes.outputs.gh_env_prefix }} – gateflow-resident-portal
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pull Vercel environment
        run: |
          vercel pull --yes \
            --environment=${{ needs.changes.outputs.vercel_env }} \
            --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_RESIDENT_PORTAL }}

      - name: Build for Vercel
        run: vercel build ${{ needs.changes.outputs.is_prod == 'true' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_RESIDENT_PORTAL }}

      - name: Deploy to Vercel
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt \
            ${{ needs.changes.outputs.is_prod == 'true' && '--prod' || '' }} \
            --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Deployed to: $URL"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_RESIDENT_PORTAL }}

  # ── Deploy: design-system ────────────────────────────────────────────────
  deploy-design-system:
    name: Deploy design-system
    needs: [changes, build-check, db-migrate]
    runs-on: ubuntu-latest
    if: |
      always() &&
      !cancelled() &&
      !failure() &&
      (needs.db-migrate.result == 'success' || needs.db-migrate.result == 'skipped') &&
      (
        github.event.inputs.app == 'design-system' ||
        ((github.event.inputs.app == 'all' || github.event.inputs.app == '') && needs.changes.outputs.design_system == 'true')
      )
    environment:
      name: ${{ needs.changes.outputs.gh_env_prefix }} – gateflow-design-system
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pull Vercel environment
        run: |
          vercel pull --yes \
            --environment=${{ needs.changes.outputs.vercel_env }} \
            --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_DESIGN_SYSTEM }}

      - name: Build for Vercel
        run: vercel build ${{ needs.changes.outputs.is_prod == 'true' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_DESIGN_SYSTEM }}

      - name: Deploy to Vercel
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt \
            ${{ needs.changes.outputs.is_prod == 'true' && '--prod' || '' }} \
            --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Deployed to: $URL"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_DESIGN_SYSTEM }}
