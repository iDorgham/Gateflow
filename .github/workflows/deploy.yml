    runs-on: ubuntu-latest
    if: |
      always() &&
      !cancelled() &&
      !failure() &&
      (needs.db-migrate.result == 'success' || needs.db-migrate.result == 'skipped') &&
      (github.event.inputs.app == '' || github.event.inputs.app == 'resident-portal') &&
      needs.changes.outputs.resident == 'true'
    environment:
      name: "${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && 'production' || 'preview' }}"
      url: '${{ steps.deploy.outputs.url }}'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pull Vercel environment
