name: Publish GateFlow Design System

on:
  push:
    branches:
      - master
    paths:
      - 'packages/tokens/**'
      - 'packages/theme/**'
      - 'packages/ui/**'
      - 'packages/components/**'
      - 'packages/ai/**'
      - '.changeset/**'

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build packages
        run: pnpm turbo run build --filter="@gateflow/*"

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changeset/action@v1
        with:
          # This expects an NPM_TOKEN secret in GitHub settings
          publish: pnpm changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
