# =============================================================================
# ci.yml — GateFlow monorepo CI
#
# Jobs (parallel after setup):
#   setup     → install deps + prisma generate + turbo cache
#   lint      → turbo lint (all workspaces)
#   typecheck → turbo typecheck (all workspaces)
#   test      → turbo test (all workspaces, with DB secrets)
#   ci-ok     → summary gate (required status check)
# =============================================================================
name: CI

permissions:
  contents: read

on:
  push:
    branches: [main, master, develop, 'feat/**', 'fix/**', 'chore/**']
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
  PNPM_VERSION: '8.15.0'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # ── 1. Setup (shared across all jobs via cache) ──────────────────────────
  setup:
    name: Setup
    runs-on: ubuntu-latest
    outputs:
      cache-key: ${{ steps.cache.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0c17529a66aca453f9227af23103ed11469b1e47 # v4.0.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @gate-access/db db:generate
        env:
          DATABASE_URL: 'postgresql://placeholder:placeholder@localhost:5432/placeholder'

      - name: Cache node_modules
        uses: actions/cache@d2993c1045a204aa70e5c832c3f87a829f032644 # v4.2.0
        id: cache
        with:
          path: |
            node_modules
            packages/*/node_modules
            apps/*/node_modules
            ~/.pnpm-store
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

  # ── 2. Lint ───────────────────────────────────────────────────────────────
  lint:
    name: Lint
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
            apps/*/node_modules
            ~/.pnpm-store
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: Install dependencies (if cache missed)
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm turbo lint

      - name: Changelog structure check
        run: pnpm docs:changelog:check

  # ── 3. Security Scan ──────────────────────────────────────────────────────
  security:
    name: Security Scan
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
            apps/*/node_modules
            ~/.pnpm-store
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: Scan for secrets
        run: pnpm check:secrets

  # ── 3. Typecheck ─────────────────────────────────────────────────────────
  typecheck:
    name: Typecheck
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
            apps/*/node_modules
            ~/.pnpm-store
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: Install dependencies (if cache missed)
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @gate-access/db db:generate
        env:
          DATABASE_URL: 'postgresql://placeholder:placeholder@localhost:5432/placeholder'

      - name: Typecheck
        run: pnpm turbo typecheck

  # ── 4. Test ───────────────────────────────────────────────────────────────
  test:
    name: Test
    needs: setup
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.CI_DATABASE_URL || 'postgresql://postgres:postgres@localhost:5432/gateflow_test' }}
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'ci-test-secret-32-chars-minimum!!' }}
      NEXTAUTH_URL: 'http://localhost:3001'
      QR_SIGNING_SECRET: ${{ secrets.QR_SIGNING_SECRET || 'ci-qr-signing-secret-32-chars-min' }}
      ENCRYPTION_MASTER_KEY: ${{ secrets.ENCRYPTION_MASTER_KEY || 'ci-encryption-key-32-chars-min!!' }}
      ADMIN_ACCESS_KEY: ${{ secrets.ADMIN_ACCESS_KEY || 'ci-admin-key' }}
      NEXT_PUBLIC_APP_URL: 'http://localhost:3001'
      SKIP_ENV_VALIDATION: 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install bun
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> $GITHUB_PATH

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
            apps/*/node_modules
            ~/.pnpm-store
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: Install dependencies (if cache missed)
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @gate-access/db db:generate
        env:
          DATABASE_URL: 'postgresql://placeholder:placeholder@localhost:5432/placeholder'

      - name: Run tests
        run: pnpm turbo test

  # ── 5. Performance budget check ───────────────────────────────────────────
  performance:
    name: Performance Budget
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
            apps/*/node_modules
            ~/.pnpm-store
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: Install dependencies (if cache missed)
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @gate-access/db db:generate
        env:
          DATABASE_URL: 'postgresql://placeholder:placeholder@localhost:5432/placeholder'

      - name: Build apps for bundle analysis
        run: |
          pnpm turbo build --filter=marketing --filter=client-dashboard
        env:
          SKIP_ENV_VALIDATION: 'true'
          DATABASE_URL: 'postgresql://placeholder:placeholder@localhost:5432/placeholder'
          NEXTAUTH_SECRET: 'ci-test-secret-32-chars-minimum!!'
          QR_SIGNING_SECRET: 'ci-qr-signing-secret-32-chars-min'
          NEXTAUTH_URL: 'http://localhost:3001'
          NEXT_PUBLIC_APP_URL: 'http://localhost:3001'
        continue-on-error: true

      - name: Check bundle size vs baseline
        run: node scripts/check-bundle-size.js
        continue-on-error: true

      - name: Check circular imports
        run: node scripts/check-imports.js --summary
        continue-on-error: true

      - name: Print .lighthouserc.js thresholds
        run: |
          echo "══ Performance Budget Summary ══════════════════════════════"
          echo "  Lighthouse CI thresholds defined in: .lighthouserc.js"
          echo "  Phase 1 targets (baseline floor):"
          echo "    Performance   ≥ 65"
          echo "    Accessibility ≥ 85"
          echo "    Best Practices ≥ 88"
          echo "    SEO            ≥ 90"
          echo "    CLS            ≤ 0.15"
          echo ""
          echo "  Full Lighthouse audit runs in: lighthouse.yml workflow"
          echo "  Analysis report: docs/perf/ANALYSIS_performance_killers.md"
          echo "═══════════════════════════════════════════════════════════"

  # ── 6. CI gate (required status check) ───────────────────────────────────
  ci-ok:
    name: CI OK
    if: always()
    needs: [lint, typecheck, test, performance, security]
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.lint.result }}" != "success" ||
                "${{ needs.typecheck.result }}" != "success" ||
                "${{ needs.security.result }}" != "success" ||
                "${{ needs.test.result }}" != "success" ]]; then
            echo "One or more CI jobs failed:"
            echo "  lint:        ${{ needs.lint.result }}"
            echo "  typecheck:   ${{ needs.typecheck.result }}"
            echo "  security:    ${{ needs.security.result }}"
            echo "  test:        ${{ needs.test.result }}"
            echo "  performance: ${{ needs.performance.result }}"
            exit 1
          fi
          echo "All CI jobs passed."
          echo "Performance job: ${{ needs.performance.result }} (non-blocking during pagespeed_100 Phase 1)"
