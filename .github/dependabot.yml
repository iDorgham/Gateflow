version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'daily'
    open-pull-requests-limit: 10
    reviewers:
      - 'iDorgham'
    labels:
      - 'dependencies'
    groups:
      monorepo-internal:
        patterns:
          - '@gate-access/*'
      react-stack:
        patterns:
          - 'react'
          - 'react-dom'
          - 'next'
      ui-stack:
        patterns:
          - '@radix-ui/*'
          - 'lucide-react'
          - 'framer-motion'
          - 'tailwind*'
          - 'shadcn*'
      dev-tools:
        patterns:
          - 'typescript'
          - 'eslint*'
          - 'prettier*'
          - 'turbo'
          - 'pnpm'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    reviewers:
      - 'iDorgham'
    labels:
      - 'ci'
