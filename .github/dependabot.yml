version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    reviewers:
      - 'iDorgham'
    labels:
      - 'dependencies'
    groups:
      monorepo-internal:
        patterns:
          - '@gate-access/*'
      react-stack:
        patterns:
          - 'react'
          - 'react-dom'
          - 'next'
      ui-stack:
        patterns:
          - '@radix-ui/*'
          - 'lucide-react'
          - 'framer-motion'
          - 'tailwind*'
          - 'shadcn*'
      dev-tools:
        patterns:
          - 'typescript'
          - 'eslint*'
          - 'prettier*'
          - 'turbo'
          - 'pnpm'
    # Prisma 7+ needs a dedicated migration (prisma.config.ts, datasource-less schema,
    # accelerateUrl or driver adapters). See:
    # https://www.prisma.io/docs/orm/more/upgrade-guides/upgrading-versions/upgrading-to-prisma-7
    ignore:
      - dependency-name: 'prisma'
        versions: ['>=7.0.0']
      - dependency-name: '@prisma/client'
        versions: ['>=7.0.0']

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    reviewers:
      - 'iDorgham'
    labels:
      - 'ci'
